# Schema-doc divergence check (R3.4).
#
# docs/db-schema.md is generated from packages/backend/migrations/*.sql. This job
# regenerates it against a throwaway Postgres and fails if the committed copy differs.
#
# The control this enforces: a migration that adds or alters a table cannot land without
# the schema doc changing in the same PR, so a new table always shows up in review as a
# doc diff. `idempotency_keys` reached production with no doc entry, and therefore no
# schema review, and therefore stored credential-bearing response bodies in plaintext.
# This job is what makes that class of silent addition impossible.
#
# Lives in its own workflow file (not ci.yml) purely to keep ownership clean; it is a
# required check in the same sense as the ci.yml jobs.
name: DB Schema Doc

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  db-schema-check:
    name: docs/db-schema.md matches migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # No `version` input: pnpm/action-setup errors out when the version is given both
      # here and as `packageManager` in package.json, which is the single source of truth.
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # The generator boots postgres:16-alpine itself via the container CLI (docker on the
      # GitHub runner, podman locally) and runs psql inside it — no host pg client needed.
      - run: pnpm db:schema:check
